<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>I love you ❤️</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body {
      min-height: 100vh; display: grid; place-items: center; overflow: hidden;
      background: #050308; color: #ffb6c1;
      font-family: Arial, Helvetica, sans-serif;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
    .message {
      position: relative; z-index: 1; text-align: center; pointer-events: none;
      color: #ffd6df; text-shadow: 0 0 12px #ff4d88, 0 0 28px #ff1f70;
      font-size: clamp(1.6rem, 6vw, 3.4rem); font-weight: 700;
      animation: pulse 1.8s ease-in-out infinite;
    }
    .sub { margin-top: .55rem; font-size: clamp(.8rem, 2.5vw, 1rem); letter-spacing: .22em; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
    @media (prefers-reduced-motion: reduce) { .message { animation: none; } }
  </style>
</head>
<body>
  <canvas id="heart" aria-hidden="true"></canvas>
  <main class="message">I love you <span aria-hidden="true">♥</span><div class="sub">WITH ALL MY HEART</div></main>
  <script>
    const canvas = document.getElementById('heart');
    const ctx = canvas.getContext('2d');
    let w, h, dpr, scale = 1, points = [];
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth; h = window.innerHeight;
      canvas.width = w * dpr; canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      scale = Math.min(w, h) / 38;
      points = [];
      for (let i = 0; i < 120; i++) {
        const t = i * Math.PI * 2 / 120;
        const x = 16 * Math.sin(t) ** 3;
        const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        points.push({ x, y });
      }
    }
    function draw(time) {
      ctx.clearRect(0, 0, w, h);
      const pulse = 1 + Math.sin(time / 500) * .035;
      const s = scale * pulse;
      ctx.save(); ctx.translate(w / 2, h / 2); ctx.scale(s, -s);
      for (let layer = 16; layer >= 11; layer--) {
        const factor = layer / 16;
        ctx.beginPath();
        points.forEach((p, i) => {
          const x = p.x * factor, y = p.y * factor;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.closePath();
        ctx.strokeStyle = 'rgba(255, 90, 150,' + (0.12 + (16-layer)*0.035) + ')';
        ctx.lineWidth = 0.055;
        ctx.shadowColor = '#ff4f91'; ctx.shadowBlur = 12;
        ctx.stroke();
      }
      ctx.restore();
      requestAnimationFrame(draw);
    }
    window.addEventListener('resize', resize);
    resize(); requestAnimationFrame(draw);
  </script>
</body>
</html>
